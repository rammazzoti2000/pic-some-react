name: Linters

on: pull_request

env:
  FORCE_COLOR: 1

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Stylelint
        run: npm run lint:css
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:run
